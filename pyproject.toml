[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qq-cli"
dynamic = ["version"]
description = "Ask a quick LLM question from your terminal, routed by Azure AI Foundry Model Router."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Bill Wilder" }]
keywords = ["azure", "azure-openai", "microsoft-foundry", "llm", "cli", "model-router"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = [
  "openai>=3.13,<4",
  "azure-identity>=1.19",
]

[project.optional-dependencies]
# Opt-in client-side tracing. Off by default: qq makes one HTTP call and
# should start fast. opentelemetry-instrumentation-openai-v2 is deprecated in
# favour of the genai package below.
otel = [
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-instrumentation-genai-openai>=1.1b0",
]

[project.urls]
Homepage = "https://github.com/CrankingAI/qq-router"
Repository = "https://github.com/CrankingAI/qq-router"
Issues = "https://github.com/CrankingAI/qq-router/issues"

[project.scripts]
qq = "qq.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.version]
path = "src/qq/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
