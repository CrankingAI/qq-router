name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned, and pinned forward. ubuntu-latest migrates to Ubuntu 26.04 between
# 2026-10-19 and 2026-11-19 (actions/runner-images#14748); 26.04 is GA, so this
# repo moved ahead of the roll-out rather than freezing on the image being
# retired. The migration is therefore a no-op here. The OS surface is small by
# design - uv fetches its own CPython, Bicep and gitleaks are static binaries,
# and only shellcheck comes from apt - so bumping this is a one-line change
# whose build proves itself.
jobs:
  python:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --python ${{ matrix.python-version }} --all-extras

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Check formatting
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      # No Azure credentials are used anywhere in CI. The Azure client is
      # stubbed out in tests, so a fork can run the full suite unchanged.
      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -q

      - name: Smoke-test the console script
        run: |
          uv run --python ${{ matrix.python-version }} qq --version
          uv run --python ${{ matrix.python-version }} qq --help

  bicep:
    name: Validate Bicep
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Bicep
        run: |
          curl -sLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Build main.bicep
        run: bicep build infra/main.bicep --stdout > /dev/null

      - name: Lint with warnings as errors
        run: bicep lint infra/main.bicep

      - name: Validate the example parameter file
        run: |
          cp infra/main.bicepparam.example infra/main.bicepparam
          bicep build-params infra/main.bicepparam --stdout > /dev/null
          rm infra/main.bicepparam

  shell:
    name: Validate shell scripts
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Syntax check
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

      - name: Help text is reachable without side effects
        run: for f in scripts/*.sh; do "$f" --help > /dev/null; done

  secrets:
    name: Secret scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The gitleaks CLI is MIT-licensed and free. Only the gitleaks-action
      # wrapper requires a paid licence for repositories owned by an
      # organisation, so install the binary directly.
      # Pinned rather than resolved from the GitHub API: unauthenticated calls
      # to api.github.com are rate limited per runner IP and returned 403.
      # Bump this when a new gitleaks release is worth picking up.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact keeps any finding out of the public build log.
      - name: Scan the working tree
        run: gitleaks dir . --redact --no-banner

      - name: Scan the full git history
        run: gitleaks git . --redact --no-banner
